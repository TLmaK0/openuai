name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Must precede vet and test: main.go has //go:embed all:frontend/dist, so
      # the package does not compile until the frontend is built. wails build
      # also generates frontend/wailsjs, which App.svelte imports and which is
      # no longer tracked -- a plain `npm run build` here cannot resolve it.
      - name: Build
        run: wails build -tags webkit2_41

      - name: Vet
        run: go vet -tags webkit2_41 ./...

      - name: Test
        run: go test -race -tags webkit2_41 ./...
